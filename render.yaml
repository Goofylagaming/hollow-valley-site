# Render Blueprint for Hollow Valley
# Docs: https://render.com/docs/blueprint-spec
#
# This deploys the site as a single Docker web service using the existing
# Dockerfile, with a persistent disk for the SQLite database.
#
# To use: push this file to the repo, then in Render dashboard choose
# "New +" -> "Blueprint" and point it at this repo/branch. Render will read
# this file and create the service. Environment variables marked
# `sync: false` must be filled in manually in the Render dashboard (they are
# secrets and are intentionally not stored in git).

services:
  - type: web
    name: hollow-valley-site
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter # upgrade if you need more RAM/CPU; starter is fine to begin
    autoDeploy: true
    healthCheckPath: /
    disk:
      name: hollowvalley-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DB_PATH
        value: /app/data/hollowvalley.sqlite
      - key: SESSION_SECRET
        generateValue: true
      - key: STEAM_RETURN_URL
        sync: false
      - key: STEAM_REALM
        sync: false
      - key: STEAM_API_KEY
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_REDIRECT_URI
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: ADMIN_DISCORD_IDS
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: RCON_HOST
        sync: false
      - key: RCON_PORT
        sync: false
      - key: RCON_PASSWORD
        sync: false
      # Website reads the automation service's shared RCON cache instead of
      # opening a second RCON connection to the game server.
      - key: AUTOMATION_SERVICE_URL
        sync: false
      - key: HOLLOW_VALLEY_API_TOKEN
        sync: false
      - key: SERVER_STATUS_POLL_INTERVAL_MS
        value: 300000
      - key: COMMAND_BRIDGE_ENABLED
        value: true
      - key: COMMAND_BRIDGE_TRANSPORT
        value: file
      - key: COMMAND_BRIDGE_SAVED_PATH
        value: Mods/CommandBridge/Saved
      - key: COMMAND_BRIDGE_TIMEOUT_MS
        value: 20000
      - key: DINOSTORAGE_RESULT_MODE
        value: submod
      - key: BODYDROP_BRIDGE_MODE
        value: commandbridge
      - key: MAX_PLAYERS
        value: 100
      - key: GAME_FILE_PROTOCOL
        value: ftp
      - key: SFTP_HOST
        sync: false
      - key: SFTP_PORT
        sync: false
      - key: SFTP_USER
        sync: false
      - key: SFTP_PASSWORD
        sync: false
      - key: SFTP_BASE_PATH
        sync: false
      - key: FTP_SECURE
        value: false
      - key: BODYDROP_SHARED_SECRET
        sync: false
      - key: BODYDROP_INBOX_PATH
        value: Mods/HollowValleyBodyDrop/Saved/inbox.ndjson
      - key: BODYDROP_COOLDOWN_SECONDS
        value: 300
      - key: BODYDROP_TYPES
        value: "small:Small body:A small emergency food drop:Compsognathus:1,medium:Medium body:A balanced body drop for a small group:Dryosaurus:1,large:Large body:A larger drop for bigger carnivores or packs:Triceratops:1"
