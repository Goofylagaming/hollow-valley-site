# Render Blueprint reference for the authoritative Hollow Valley website.
#
# Runtime game integration is owned by the separate hollow-valley-automation
# service. The website must not be given RCON, FTP/SFTP, CommandBridge-publisher,
# or Discord bot credentials.

services:
  - type: web
    name: hollow-valley-site
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    autoDeploy: true
    healthCheckPath: /
    disk:
      name: hollowvalley-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /app/data/hollowvalley.sqlite
      - key: PUBLIC_SITE_URL
        value: https://hollowvalleyisle.com
      - key: SESSION_SECRET
        generateValue: true

      # Website account/auth integrations.
      - key: STEAM_RETURN_URL
        sync: false
      - key: STEAM_REALM
        sync: false
      - key: STEAM_API_KEY
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_REDIRECT_URI
        sync: false
      - key: ADMIN_DISCORD_IDS
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false

      # The website reads game state and submits game actions only through the
      # authoritative automation service.
      - key: AUTOMATION_SERVICE_URL
        sync: false
      - key: HOLLOW_VALLEY_API_TOKEN
        sync: false
      - key: SERVER_STATUS_POLL_INTERVAL_MS
        value: 15000
      - key: MAX_PLAYERS
        value: 100
      - key: BODYDROP_COOLDOWN_SECONDS
        value: 600
