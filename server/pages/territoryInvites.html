<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Territory Wars Group Invites | Hollow Valley</title>
  <meta name="robots" content="noindex,nofollow">
  <style>
    :root { color-scheme:dark; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:#071611; color:#e2f6eb }
    * { box-sizing:border-box }
    body { margin:0; min-height:100vh; background:radial-gradient(circle at 85% 0%,#12392d 0%,#071611 55%); }
    header { border-bottom:1px solid #285040; background:#081c15f2; padding:18px max(16px,calc((100vw - 1050px)/2)); }
    header a { color:#80d5a8;text-decoration:none;font-weight:700 }
    header strong { color:#eefbf2;margin-left:14px }
    main { margin:56px auto;max-width:760px;padding:0 18px }
    .kicker { color:#69da9f;text-transform:uppercase;font-size:12px;letter-spacing:.12em;font-weight:700 }
    h1 { font-size:clamp(28px,5vw,42px);margin:10px 0 }
    .intro { color:#afc8bb;line-height:1.6 }
    .panel { border:1px solid #315647;background:#0b2319;border-radius:16px;padding:24px;margin-top:25px }
    .panel h2 { font-size:20px;margin:0 0 15px }
    .invite { display:flex;align-items:center;justify-content:space-between;gap:20px;border-top:1px solid #2c4b3d;padding:18px 0 }
    .invite strong,.invite span { display:block }
    .invite span { font-size:13px;color:#a6c5b6;margin-top:5px }
    button { background:#2bba75;color:#06150c;border:0;border-radius:10px;font-size:14px;font-weight:700;padding:11px 18px;cursor:pointer }
    button:disabled { opacity:.55;cursor:wait }
    .muted { color:#a6c5b6;line-height:1.6 }
    .error { color:#ff9e9e }
    #status { min-height:24px }
    @media(max-width:550px) { .invite { align-items:flex-start;flex-direction:column } main { margin:28px auto } }
  </style>
</head>
<body>
  <header><a href="/groups/">← Groups</a><strong>HOLLOW VALLEY · TERRITORY WARS</strong></header>
  <main>
    <div class="kicker">Steam-linked player access</div>
    <h1>Your Territory Wars group invites</h1>
    <p class="intro">View and accept invitations sent to your Steam account. This page does not give access to the Territory Wars admin controls.</p>
    <section class="panel" aria-labelledby="invites-heading">
      <h2 id="invites-heading">Pending invitations</h2>
      <p id="status" class="muted" role="status" aria-live="polite">Loading your group invitations…</p>
      <div id="invites"></div>
    </section>
  </main>
  <script src="/assets/territory-invites.js?v=1" defer></script>
</body>
</html>
