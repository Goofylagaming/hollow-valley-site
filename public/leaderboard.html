<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Hollow Valley permanent levels, verified playtime and daily/weekly combat rankings.">
  <title>Leaderboard | Hollow Valley</title>
  <link rel="stylesheet" href="assets/styles.css?v=15">
</head>
<body>
  <div class="app-shell">
    <div id="nav-slot"></div>
    <main>
      <section class="page-header">
        <p class="overline green">RANKINGS</p>
        <h1>Leaderboard.</h1>
        <p class="section-intro">Kills and K:D are tracked from the authoritative combat feed from The Isle. Daily rankings reset at midnight Brisbane time; weekly rankings run Monday to Sunday.</p>
      </section>
      <section class="roster-section">
        <div class="filter-row" role="group" aria-label="Leaderboard tabs">
          <button class="filter active" data-tab="mostLevels">Levels</button>
          <button class="filter" data-tab="mostKills">Kills</button>
          <button class="filter" data-tab="bestKd">K:D</button>
          <button class="filter" data-tab="mostPlaytime">Playtime · 31 days</button>
        </div>
        <div id="lb-content">
          <table class="leaderboard-table">
            <thead><tr><th>#</th><th>Player</th><th>Loading</th></tr></thead>
            <tbody><tr><td colspan="3">Loading…</td></tr></tbody>
          </table>
        </div>
      </section>
    </main>
    <footer><span>© 2026 Hollow Valley</span><span>ISLE SERVER · HOME OF THE HERBY DEATH SQUAD</span><a href="/">Back to top ↑</a></footer>
  </div>
  <script src="assets/common.js?v=16"></script>
  <script src="assets/leaderboard.js?v=5"></script>
</body>
</html>
