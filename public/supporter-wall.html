<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Supporter wall · Hollow Valley</title><link rel="stylesheet" href="/assets/membership-rewards.css"></head>
<body><main><a href="/supporter">My Membership</a><h1>Supporter wall</h1><ul id="wall"></ul>
<h2>Community showcase</h2><ul id="cards"></ul>

<button>Submit for review</button></form><button id="withdraw">Withdraw my card</button>
<section id="reviews" hidden><h2>Review submissions</h2></section><p role="status" id="status"></p></main><script src="/assets/supporter-wall.js"></script></body></html>
