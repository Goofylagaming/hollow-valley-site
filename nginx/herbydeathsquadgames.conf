# Nginx config for the root brand domain (static landing page).
# Serves landing/index.html directly — no Node app involved.
# Copy to /etc/nginx/sites-available/herbydeathsquadgames.conf on your server, then:
#   sudo ln -s /etc/nginx/sites-available/herbydeathsquadgames.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Afterwards run certbot (see DEPLOYMENT.md) to add HTTPS automatically.

server {
    listen 80;
    server_name herbydeathsquadgames.com www.herbydeathsquadgames.com;

    root /opt/hollow-valley-site/landing;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
