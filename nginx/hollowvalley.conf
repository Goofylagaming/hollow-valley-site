# Nginx reverse proxy config for the Herby Death Squad portal.
# Copy to /etc/nginx/sites-available/hollowvalley.conf on your server, then:
#   sudo ln -s /etc/nginx/sites-available/hollowvalley.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Afterwards run certbot (see DEPLOYMENT.md) to add HTTPS automatically.

server {
    listen 80;
    server_name hollowvalley.herbydeathsquadgames.com;

    # GitHub webhook -> local auto-deploy listener (see deploy/README.md).
    location /hooks/ {
        proxy_pass http://127.0.0.1:9000/hooks/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
