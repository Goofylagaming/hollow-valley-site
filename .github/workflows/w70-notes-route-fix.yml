name: Verify gateway-safe Web notes route
on:
  push:
    branches: ['fix/w70-web-notes-route']
    paths: ['.github/workflows/w70-notes-route-fix.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Add the archive outside the gameplay gateway and verify exact content
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('brand-sites/publish-wikis.mjs');s=p.read_text()
          a=" ['web/patch-notes/index.html',notesPage('web')],"
          assert s.count(a)==1;s=s.replace(a,a+"\n ['patch-notes/web/index.html',notesPage('web')],")
          a="await writeFile(file,data,'utf8');"
          assert s.count(a)==1;s=s.replace(a,"await writeFile(file,data.replaceAll('/web/patch-notes/','/patch-notes/web/'),'utf8');")
          p.write_text(s)
          p=Path('brand-sites/verify.mjs');s=p.read_text()
          a="guide.includes('href=\"/'+label+'/patch-notes/\"')"
          assert s.count(a)==1;s=s.replace(a,"guide.includes('href=\"'+(label==='web'?'/patch-notes/web/':'/world/patch-notes/')+'\"')")
          a="notesHome.includes('href=\"/web/patch-notes/\"')"
          assert s.count(a)==1;s=s.replace(a,"notesHome.includes('href=\"/patch-notes/web/\"')")
          a="const notes=file.endsWith(join('patch-notes','index.html'));"
          assert s.count(a)==1;s=s.replace(a,"const notes=file.endsWith(join('patch-notes','index.html'))||(site==='primalbound'&&file===join(base,'patch-notes','web','index.html'));")
          s+="\n// The branded /web/* gateway serves gameplay; keep the public archive outside it.\nconst webNotesAlias=await readFile(join(base,'patch-notes/web/index.html'),'utf8');\nassert.equal(webNotesAlias,webNotes,'Legacy static archive and gateway-safe route must stay identical');\nassert.ok(webNotesAlias.includes('href=\"https://primalboundgame.com/patch-notes/web/\"'),'Web archive canonical URL must avoid the game gateway');\nassert.ok(!web.includes('href=\"/web/patch-notes/\"')&&!notesHome.includes('href=\"/web/patch-notes/\"'),'Published guide links must use the gateway-safe archive');\n"
          p.write_text(s)
          PY
          git diff --check
          node brand-sites/build.mjs --production
          node brand-sites/verify.mjs --production
          node brand-sites/build.mjs
          node brand-sites/verify.mjs
      - name: Keep the verified two-file change on this development branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = 'refs/heads/fix/w70-web-notes-route'
          git add brand-sites/publish-wikis.mjs brand-sites/verify.mjs
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Serve Web patch notes outside the gameplay gateway and update guide links'
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin HEAD:refs/heads/fix/w70-web-notes-route
# No game, gateway, account, DNS or production deployment changes.
