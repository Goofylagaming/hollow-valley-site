name: Verify live W70 and prepare complete player guide
on:
  push:
    branches: ['docs/web-w70-complete-guide']
    paths: ['tools/w70-*', '.github/workflows/w70-guide-preparation.yml']
permissions:
  contents: write
jobs:
  verify-and-prepare:
    if: github.ref == 'refs/heads/docs/web-w70-complete-guide'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the published game on all three supported entrypoints
        run: node tools/w70-public-verify.mjs
      - name: Add five complete how-to chapters, preserving earlier guide and history
        run: |
          python tools/w70-guide-update.py --commit 5ebfccaaad8d0751e16c1d1b61d1664836732999 --published-at 2026-11-09T22:28:10.092583Z --release-info evidence/live-release-info.json
          git diff --check
          node brand-sites/build.mjs --production
          node brand-sites/verify.mjs --production
          node brand-sites/build.mjs
          node brand-sites/verify.mjs
      - name: Commit verified documentation to its own branch, without deploying
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = 'refs/heads/docs/web-w70-complete-guide'
          git add brand-sites/wiki-source/web/wiki/index.html brand-sites/wiki-source/release-archive.json brand-sites/wiki-source/README.md
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Document verified live W70 Legacy, Mastery, Habitat Care and Bloodlines'
          git rev-parse HEAD > evidence/guide-commit.txt
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin HEAD:refs/heads/docs/web-w70-complete-guide
      - name: Keep read-only public verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w70-public-guide-evidence-${{ github.run_id }}
          path: evidence/
          retention-days: 3
# No production deployment, live player writes, account login, DNS or manual announcement.
# Only documentation is pushed to the exact named development branch after all checks pass.
