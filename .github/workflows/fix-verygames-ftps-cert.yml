name: Fix VeryGames FTPS certificate handling

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/fix-verygames-ftps-cert.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch scoped FTPS certificate handling
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("server/services/sftpBridge.js")
          text = path.read_text()
          pattern = re.compile(
              r'(function createFtpBridgeClient\(\) \{.*?async connect\(config\) \{\s*)'
              r'await client\.access\(\{\s*'
              r'host: config\.host,\s*'
              r'port: config\.port,\s*'
              r'user: config\.user,\s*'
              r'password: config\.password,\s*'
              r'secure: \(process\.env\.FTP_SECURE \|\| process\.env\.GAME_FILE_SECURE \|\| ""\)\.toLowerCase\(\) === "true",\s*'
              r'\}\);',
              re.S,
          )
          replacement = r'''\1const secure = (process.env.FTP_SECURE || process.env.GAME_FILE_SECURE || "").toLowerCase() === "true";
              await client.access({
                host: config.host,
                port: config.port,
                user: config.user,
                password: config.password,
                secure,
                secureOptions: secure ? { rejectUnauthorized: false } : undefined,
              });'''
          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"Expected one FTP connect block, patched {count}")
          path.write_text(updated)
          PY

      - name: Add regression test
        shell: bash
        run: |
          cat > test/ftpTls.test.js <<'EOF'
          const test = require("node:test");
          const assert = require("node:assert/strict");
          const { Client: FtpClient } = require("basic-ftp");
          const files = require("../server/services/sftpBridge");

          test("explicit FTPS passes the VeryGames certificate override only to basic-ftp", async (t) => {
            const env = {
              GAME_FILE_PROTOCOL: "ftp",
              SFTP_HOST: "host.invalid",
              SFTP_PORT: "21",
              SFTP_USER: "test",
              SFTP_PASSWORD: "test-password",
              FTP_SECURE: "true",
            };
            const original = Object.fromEntries(Object.keys(env).map((key) => [key, process.env[key]]));
            Object.assign(process.env, env);
            t.after(() => {
              for (const [key, value] of Object.entries(original)) {
                if (value === undefined) delete process.env[key];
                else process.env[key] = value;
              }
            });

            let accessOptions;
            t.mock.method(FtpClient.prototype, "access", async (options) => { accessOptions = options; });
            t.mock.method(FtpClient.prototype, "close", () => {});

            const client = files.createFileBridgeClient();
            await client.connect(files.getFileBridgeConfig());
            await client.end();

            assert.equal(accessOptions.secure, true);
            assert.deepEqual(accessOptions.secureOptions, { rejectUnauthorized: false });
          });
          EOF

      - name: Run FTP bridge tests
        run: |
          npm ci --ignore-scripts
          node --test test/ftpCommandPublish.test.js test/ftpTls.test.js

      - name: Commit fix and remove bootstrap workflow
        shell: bash
        run: |
          rm -f .github/workflows/fix-verygames-ftps-cert.yml
          git config user.name "Goofylagaming"
          git config user.email "goofylagaming@hotmail.com"
          git add -A
          git commit -m "Trust VeryGames FTPS certificate for file bridge"
          git push origin HEAD:master
