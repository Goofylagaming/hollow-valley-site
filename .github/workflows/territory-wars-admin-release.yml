name: Territory Wars Four-Admin Production Release

on:
  push:
    branches:
      - feature/territory-wars-live-four-admin-20261017
    paths:
      - 'server/**'
      - 'public/adminterritorywars.html'
      - 'public/admin.html'
      - 'public/assets/admin-territory-wars.js'
      - 'public/assets/territory-wars*'
      - 'public/assets/common.js'
      - 'public/partials/nav.html'
      - 'test/territory*'
      - 'server/pages/territoryInvites.html'
      - 'public/livemap.html'
      - 'public/assets/territory-invites.js'
      - 'test/productionUiRelease.test.js'
      - '.github/workflows/territory-wars-admin-release.yml'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  territory-admin:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify JS syntax before executing
        run: |
          node --check server/index.js
          node --check server/routes/territoryWars.js
          node --check server/routes/mapdata.js
          node --check server/routes/territoryOverlay.js
          node --check server/services/territoryOverlayState.js
          node --check server/services/territoryOverlayMath.js
          node --check server/services/territoryAreas.js
          node --check public/assets/livemap.js
          node --check public/assets/territory-map-overlay.js
          node --check server/services/territoryGeometry.js
          node --check server/services/territoryCombatSync.js
          node --check server/services/territoryDiscordFeed.js
          node --check automation-platform/src/routes/websiteTerritoryFeedRoutes.js
          node --check public/assets/admin-territory-wars.js
          node --check public/assets/territory-wars.js
          node --check public/assets/territory-invites.js
          node --check test/territoryAdminRelease.test.js
      - name: Test four-person security gate, geometry, control and momentum
        run: node --test test/liveMapTerritoryIntegration.test.js test/territoryAdminRelease.test.js test/territoryAdminHttp.test.js test/territoryInviteAccess.test.js test/territoryGeometry.test.js test/territoryControl.test.js test/territoryMomentum.test.js test/territoryDiscordFeed.test.js
      - name: Production identity, Groups and UI regression gates
        run: node --test test/groups.test.js test/groupProgress.test.js test/productionUiRelease.test.js
      - name: Diagnostic only - full legacy suite (known unrelated fixture failures)
        continue-on-error: true
        run: npm test
