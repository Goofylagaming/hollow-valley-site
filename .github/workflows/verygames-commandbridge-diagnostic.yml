name: VeryGames CommandBridge Diagnostic

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/verygames-commandbridge-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node dependencies and lftp
        run: |
          npm ci --ignore-scripts
          sudo apt-get update -qq
          sudo apt-get install -y lftp

      - name: Probe VeryGames with the same basic-ftp client used by Render
        shell: bash
        env:
          FTP_HOST: ${{ secrets.VERYGAMES_FTP_HOST }}
          FTP_PORT: ${{ secrets.VERYGAMES_FTP_PORT }}
          FTP_USER: ${{ secrets.VERYGAMES_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.VERYGAMES_FTP_PASSWORD }}
        run: |
          node <<'NODE'
          const { Client } = require('basic-ftp');
          const { Readable } = require('node:stream');
          const crypto = require('node:crypto');

          const dir = '/TheIsle/Binaries/Win64/ue4ss/Mods/CommandBridge/Saved';
          const host = process.env.FTP_HOST;
          const port = Number(process.env.FTP_PORT || 21);
          const user = process.env.FTP_USER;
          const password = process.env.FTP_PASS;

          function safeError(err) {
            return {
              name: err?.name,
              code: err?.code,
              message: String(err?.message || err).replace(password || '__never__', '[redacted]'),
            };
          }

          async function probe(label, secure) {
            const client = new Client(20000);
            const id = crypto.randomUUID();
            const first = `.chatgpt-ftp-probe-${id}.tmp`;
            const second = `.chatgpt-ftp-probe-${id}.renamed`;
            const steps = [];
            let ok = false;
            try {
              await client.access({
                host, port, user, password, secure,
                secureOptions: secure ? { rejectUnauthorized: false } : undefined,
              });
              steps.push(['access', 'ok']);
              steps.push(['pwd-before', await client.pwd()]);
              await client.cd(dir);
              steps.push(['cwd', 'ok']);
              steps.push(['pwd-after', await client.pwd()]);
              await client.uploadFrom(Readable.from(['probe\n']), first);
              steps.push(['stor-relative', 'ok']);
              steps.push(['size-relative', await client.size(first)]);
              await client.rename(first, second);
              steps.push(['rename-relative', 'ok']);
              await client.remove(second);
              steps.push(['delete-relative', 'ok']);
              await client.cd('/');
              steps.push(['cwd-root', 'ok']);
              ok = true;
            } catch (err) {
              steps.push(['error', safeError(err)]);
              try { await client.remove(first); } catch {}
              try { await client.remove(second); } catch {}
            } finally {
              client.close();
            }
            console.log(JSON.stringify({ label, secure, ok, steps }, null, 2));
            return ok;
          }

          (async () => {
            const plain = await probe('plain-ftp', false);
            const explicitTls = await probe('explicit-ftps', true);
            if (!plain && !explicitTls) process.exitCode = 1;
          })().catch((err) => {
            console.error(JSON.stringify(safeError(err)));
            process.exitCode = 1;
          });
          NODE

      - name: Capture focused UE4SS snapshot
        shell: bash
        env:
          FTP_HOST: ${{ secrets.VERYGAMES_FTP_HOST }}
          FTP_PORT: ${{ secrets.VERYGAMES_FTP_PORT }}
          FTP_USER: ${{ secrets.VERYGAMES_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.VERYGAMES_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p commandbridge-snapshot
          lftp -c "
            set cmd:fail-exit yes;
            set ssl:verify-certificate no;
            set net:max-retries 3;
            open -p \"$FTP_PORT\" -u \"$FTP_USER\",\"$FTP_PASS\" \"$FTP_HOST\";
            mirror --verbose /TheIsle/Binaries/Win64/ue4ss/Mods/CommandBridge commandbridge-snapshot/CommandBridge;
            mirror --verbose /TheIsle/Binaries/Win64/ue4ss/Mods/DinoStorage commandbridge-snapshot/DinoStorage;
            mirror --verbose /TheIsle/Binaries/Win64/ue4ss/Mods/BodyDrop commandbridge-snapshot/BodyDrop;
            get /TheIsle/Binaries/Win64/ue4ss/Mods/mods.txt -o commandbridge-snapshot/mods.txt;
            get /TheIsle/Binaries/Win64/ue4ss/UE4SS.log -o commandbridge-snapshot/UE4SS.log || true;
            bye;
          "
          find commandbridge-snapshot -type f -printf '%p %s bytes\n' | sort

      - name: Upload focused snapshot
        uses: actions/upload-artifact@v4
        with:
          name: verygames-commandbridge-snapshot
          path: commandbridge-snapshot/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
