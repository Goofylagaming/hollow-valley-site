name: Group Treasury accounting
on:
  pull_request:
    paths:
      - 'automation-platform/src/services/groupTreasuryService.js'
      - 'automation-platform/src/services/groupTreasurySpending.js'
      - 'automation-platform/src/services/groupTreasuryCatalog.js'
      - 'scripts/review-group-treasury-catalog.cjs'
      - 'automation-platform/test/groupTreasuryCatalog.test.js'
      - 'automation-platform/src/services/groupTreasuryAccounting.js'
      - 'automation-platform/src/services/groupTreasuryClosure.js'
      - 'server/services/groupTreasuryClosure.js'
      - 'server/services/groupTreasuryLifecycle.js'
      - 'server/groupsStore.js'
      - 'server/routes/groups.js'
      - 'public/assets/groups.js'
      - 'test/groupTreasuryClosure.test.js'
      - 'automation-platform/test/groupTreasurySpending.test.js'
      - 'automation-platform/src/services/economyStore.js'
      - 'automation-platform/test/groupTreasury.test.js'
      - 'automation-platform/test/economyWallet.test.js'
      - 'automation-platform/test/marketplaceEconomy.test.js'
      - 'automation-platform/src/routes/websiteGroupTreasuryRoutes.js'
      - 'server/routes/groupTreasury.js'
      - 'server/services/groupTreasury.js'
      - 'server/services/groupTreasuryPurchases.js'
      - 'test/groupTreasuryPurchases.test.js'
      - 'public/assets/group-treasury-shop.js'
      - 'scripts/verify-group-purchases.cjs'
      - 'server/services/automationWebsiteClient.js'
      - 'server/index.js'
      - 'automation-platform/src/index.js'
      - 'test/groupTreasuryHttp.test.js'
      - 'public/groups.html'
      - 'public/assets/group-treasury.js'
      - 'public/assets/groups.css'
      - 'scripts/verify-group-treasury.cjs'
      - 'server/services/roadmapCommunity.js'
      - 'test/roadmapCommunity.test.js'
      - '.github/workflows/group-treasury.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test automation-platform/test/groupTreasuryCatalog.test.js test/groupTreasuryPurchases.test.js test/groupTreasuryClosure.test.js test/groups.test.js test/groupProgress.test.js test/groupRecruitment.test.js automation-platform/test/groupTreasurySpending.test.js automation-platform/test/groupTreasury.test.js automation-platform/test/economyWallet.test.js automation-platform/test/marketplaceEconomy.test.js test/groupTreasuryHttp.test.js test/roadmapCommunity.test.js test/hvRoadmapIntegration.test.js test/hvUx01NavigationHome.test.js test/territoryAdminHttp.test.js
