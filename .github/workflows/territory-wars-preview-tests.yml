name: Territory Wars Preview Tests

on:
  push:
    branches:
      - test-ui-v2
    paths:
      - 'server/routes/territoryWars.js'
      - 'server/services/territoryGeometry.js'
      - 'server/services/territoryControl.js'
      - 'server/services/territoryMomentum.js'
      - 'server/services/territoryCombatClient.js'
      - 'server/services/territoryCombatSync.js'
      - 'server/index.js'
      - 'server/evrimaMap.js'
      - 'server/services/serverStatus.js'
      - 'automation-platform/src/services/combatEventService.js'
      - 'automation-platform/src/routes/territoryCombatWebsiteRoutes.js'
      - 'automation-platform/src/index.js'
      - 'automation-platform/test/combatEventService.test.js'
      - 'public/groups/territory-wars/**'
      - 'public/adminterritorywars.html'
      - 'public/assets/territory-wars.js'
      - 'public/assets/admin-territory-wars.js'
      - 'public/assets/territory-wars.css'
      - 'test/territoryWarsRoute.test.js'
      - 'test/territoryGeometry.test.js'
      - 'test/territoryControl.test.js'
      - 'test/territoryMomentum.test.js'
      - 'test/territoryCombatSync.test.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/territory-wars-preview-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  territory-wars:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Territory Wars portal tests
        run: node --test test/territoryWarsRoute.test.js test/territoryGeometry.test.js test/territoryControl.test.js test/territoryMomentum.test.js test/territoryCombatSync.test.js

      - name: Run authoritative combat enrichment tests
        run: node --test automation-platform/test/combatEventService.test.js
