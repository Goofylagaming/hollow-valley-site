name: Validate Admin Player Controls

on:
  pull_request:
    paths:
      - "public/admin.html"
      - "public/assets/admin.js"
      - "public/assets/styles.css"
      - "server/routes/adminOperations.js"
      - "server/services/automationWebsiteClient.js"
      - "automation-platform/src/routes/adminRoutes.js"
      - "automation-platform/src/services/adminActionsService.js"
      - "automation-platform/src/services/commandBridgeService.js"
      - "server-mods/CommandBridge/Scripts/main.lua"
      - "server-mods/AdminActions/**"
      - "test/adminOperationsRoute.test.js"
      - "test/adminPlayerControls.test.js"
      - ".github/workflows/validate-admin-player-controls.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run admin player-control tests
        run: node --test test/adminPlayerControls.test.js test/adminOperationsRoute.test.js
      - name: Install Lua
        run: sudo apt-get update -qq && sudo apt-get install -y lua5.4
      - name: Validate CommandBridge Lua
        run: luac -p server-mods/CommandBridge/Scripts/main.lua
      - name: Validate AdminActions Lua
        run: luac -p server-mods/AdminActions/Scripts/main.lua
