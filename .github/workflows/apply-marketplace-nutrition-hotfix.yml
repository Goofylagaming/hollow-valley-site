name: Apply Marketplace Dino Nutrition Hotfix

on:
  push:
    branches:
      - fix/marketplace-dino-nutrition

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/marketplace-dino-nutrition
          fetch-depth: 0

      - name: Apply narrow nutrition patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          lua_path = Path('server-mods/DinoStorage/Scripts/main.lua')
          lua = lua_path.read_text(encoding='utf-8')
          old = '''        string.format('  "classPath": "%s",', jsonEscape(classPath)),
                  string.format('  "growth": %.6f,', growth),
              }
          '''
          new = '''        string.format('  "classPath": "%s",', jsonEscape(classPath)),
                  string.format('  "growth": %.6f,', growth),
                  -- Marketplace grants are synthetic, so there is no captured live-dino
                  -- food/diet snapshot. Seed full normal diet values for first redemption.
                  '  "hunger": 9999.0,',
                  '  "food": 9999.0,',
                  '  "nutrients": {"carbValue":9999.0,"proteinValue":9999.0,"lipidValue":9999.0,"bonesValue":0,"cannibalValue":0,"magyValue":0,"rottenFleshValue":0,"mushroomsValue":0,"bMalnutrition":false},',
              }
          '''
          if lua.count(old) != 1:
              raise SystemExit(f'Lua marketplace grant anchor count was {lua.count(old)}, expected 1')
          lua_path.write_text(lua.replace(old, new, 1), encoding='utf-8')

          js_path = Path('automation-platform/src/services/officialMarketplaceFulfillmentService.js')
          js = js_path.read_text(encoding='utf-8')
          old = '''    classPath: dino.classPath,
              growth: dino.growth,
              ...(dino.isPrime ? { isPrime: true, primeData: { eligible: true, cond1: true, cond2: true } } : {}),
          '''
          new = '''    classPath: dino.classPath,
              growth: dino.growth,
              hunger: 9999,
              food: 9999,
              nutrients: {
                carbValue: 9999,
                proteinValue: 9999,
                lipidValue: 9999,
                bonesValue: 0,
                cannibalValue: 0,
                magyValue: 0,
                rottenFleshValue: 0,
                mushroomsValue: 0,
                bMalnutrition: false,
              },
              ...(dino.isPrime ? { isPrime: true, primeData: { eligible: true, cond1: true, cond2: true } } : {}),
          '''
          if js.count(old) != 1:
              raise SystemExit(f'JS stored-state anchor count was {js.count(old)}, expected 1')
          js_path.write_text(js.replace(old, new, 1), encoding='utf-8')

          test_path = Path('automation-platform/test/officialMarketplaceFulfillment.test.js')
          test = test_path.read_text(encoding='utf-8')
          old = '''  assert.equal(state.isPrime, true);
            assert.deepEqual(state.primeData, { eligible: true, cond1: true, cond2: true });
            for (const forbidden of ['isFemale', 'health', 'stamina', 'skin', 'mutations', 'nutrients']) {
              assert.equal(Object.hasOwn(state, forbidden), false, `${forbidden} should not be fabricated`);
            }
          '''
          new = '''  assert.equal(state.isPrime, true);
            assert.deepEqual(state.primeData, { eligible: true, cond1: true, cond2: true });
            assert.equal(state.hunger, 9999);
            assert.equal(state.food, 9999);
            assert.deepEqual(state.nutrients, {
              carbValue: 9999,
              proteinValue: 9999,
              lipidValue: 9999,
              bonesValue: 0,
              cannibalValue: 0,
              magyValue: 0,
              rottenFleshValue: 0,
              mushroomsValue: 0,
              bMalnutrition: false,
            });
            for (const forbidden of ['isFemale', 'health', 'stamina', 'skin', 'mutations']) {
              assert.equal(Object.hasOwn(state, forbidden), false, `${forbidden} should not be fabricated`);
            }
          '''
          if test.count(old) != 1:
              raise SystemExit(f'JS test anchor count was {test.count(old)}, expected 1')
          test_path.write_text(test.replace(old, new, 1), encoding='utf-8')

          static_path = Path('test/marketplaceDinoGrantMods.test.js')
          static = static_path.read_text(encoding='utf-8')
          old_cb = 'v006' + chr(92) + '.2'
          if static.count(old_cb) != 1:
              raise SystemExit(f'CommandBridge test version anchor count was {static.count(old_cb)}, expected 1')
          static = static.replace(old_cb, 'v006' + chr(92) + '.6', 1)
          static = static.replace('assert.match(source, /MOD_VERSION = "v005"/);', 'assert.match(source, /MOD_VERSION = "v008"/);', 1)
          anchor = '  assert.match(source, /target slot contains another dinosaur/);\n'
          addition = '''  assert.match(source, /"hunger": 9999\\.0/);
            assert.match(source, /"food": 9999\\.0/);
            assert.match(source, /"carbValue":9999\\.0/);
            assert.match(source, /"proteinValue":9999\\.0/);
            assert.match(source, /"lipidValue":9999\\.0/);
          '''
          if static.count(anchor) != 1:
              raise SystemExit(f'Static test anchor count was {static.count(anchor)}, expected 1')
          static_path.write_text(static.replace(anchor, anchor + addition, 1), encoding='utf-8')
          PY

      - name: Validate Lua syntax
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4
          luac -p server-mods/DinoStorage/Scripts/main.lua

      - name: Install automation dependencies
        shell: bash
        run: |
          cd automation-platform
          npm install --omit=dev --no-audit --no-fund

      - name: Run focused marketplace tests
        shell: bash
        run: |
          node --test automation-platform/test/officialMarketplaceFulfillment.test.js
          node --test test/marketplaceDinoGrantMods.test.js

      - name: Commit verified patch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-marketplace-nutrition-hotfix.yml
          git add server-mods/DinoStorage/Scripts/main.lua \
                  automation-platform/src/services/officialMarketplaceFulfillmentService.js \
                  automation-platform/test/officialMarketplaceFulfillment.test.js \
                  test/marketplaceDinoGrantMods.test.js
          git commit -m "fix: initialize marketplace dino food and nutrients"
          git push origin HEAD:fix/marketplace-dino-nutrition
