name: Validate UI-v2 production release

on:
  pull_request:
    paths:
      - "public/**"
      - "test/productionUiRelease.test.js"
      - "scripts/uiV2BrowserSmoke.cjs"
      - ".github/workflows/validate-ui-v2-production-release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-safety:
    name: Production identity and feature-preservation tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install exact production dependencies
        run: npm ci
      - name: Check production backend and page-script compatibility
        run: node --test test/productionUiRelease.test.js
      - name: Compare full regression suite against pinned live-production baseline
        shell: bash
        run: |
          set +e
          npm test > candidate-suite.log 2>&1
          candidate_exit=$?
          set -e
          git worktree add --detach "$RUNNER_TEMP/hollow-valley-production-baseline" 86499c14d1e587714dcd2e4ab9ec91a85284aa15
          cd "$RUNNER_TEMP/hollow-valley-production-baseline"
          npm ci > "$GITHUB_WORKSPACE/baseline-install.log" 2>&1
          set +e
          npm test > "$GITHUB_WORKSPACE/baseline-suite.log" 2>&1
          baseline_exit=$?
          set -e
          cd "$GITHUB_WORKSPACE"
          echo "Candidate npm test exit: $candidate_exit"
          echo "Baseline npm test exit: $baseline_exit"
          node scripts/compare-ui-release-baseline-tests.cjs candidate-suite.log baseline-suite.log
      - name: Archive comparison test outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-v2-production-vs-baseline
          path: |
            candidate-suite.log
            baseline-suite.log
            baseline-install.log
          if-no-files-found: ignore
          retention-days: 3

  staging-browser-smoke:
    name: Browser staging (isolated DB, desktop/mobile, guest auth)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install production dependencies
        run: npm ci
      - name: Install temporary browser test harness
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Launch isolated staging site and test real pages in Chromium
        env:
          DB_PATH: ${{ runner.temp }}/hollow-valley-ui-v2-staging.sqlite
          NODE_ENV: test
          SESSION_SECRET: ci-staging-only-not-a-production-secret
        run: node scripts/uiV2BrowserSmoke.cjs
      - name: Upload browser screenshots for desktop/phone acceptance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-v2-release-candidate-browser-screenshots
          path: staging-ui-screenshots/
          if-no-files-found: ignore
          retention-days: 7
