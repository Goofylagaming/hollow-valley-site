name: Free season track evidence
on:
  pull_request:
    paths:
      - 'automation-platform/src/services/progressionService.js'
      - 'automation-platform/src/services/progressionSourceTime.js'
      - 'automation-platform/test/progressionService.test.js'
      - 'automation-platform/test/progressionSourceTime.test.js'
      - 'automation-platform/src/services/seasonTrackStore.js'
      - 'automation-platform/test/seasonTrackStore.test.js'
      - 'scripts/review-season-track.cjs'
      - 'test/seasonTrackOperator.test.js'
      - 'server/services/roadmapCommunity.js'
      - 'public/assets/home-roadmap.js'
      - '.github/workflows/season-track.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test automation-platform/test/seasonTrackStore.test.js test/seasonTrackOperator.test.js automation-platform/test/progressionSourceTime.test.js automation-platform/test/progressionService.test.js automation-platform/test/questBoosts.test.js automation-platform/test/questChallengeExpansion.test.js test/valleyLegacyTelemetry.test.js test/roadmapCommunity.test.js test/hvRoadmapIntegration.test.js test/hvUx01NavigationHome.test.js test/productionUiRelease.test.js
