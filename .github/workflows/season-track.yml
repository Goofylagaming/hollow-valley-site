name: Free season track evidence
on:
  pull_request:
    paths:
      - 'automation-platform/src/services/progressionService.js'
      - 'automation-platform/src/services/progressionSourceTime.js'
      - 'automation-platform/src/services/achievementSourceTime.js'
      - 'automation-platform/src/services/achievementLifeSource.js'
      - 'automation-platform/test/achievementLifeSource.test.js'
      - 'automation-platform/test/achievementSourceTime.test.js'
      - 'automation-platform/test/seasonAchievementPoints.test.js'
      - 'automation-platform/test/progressionService.test.js'
      - 'automation-platform/test/progressionSourceTime.test.js'
      - 'automation-platform/src/services/seasonTrackStore.js'
      - 'automation-platform/test/seasonTrackStore.test.js'
      - 'scripts/review-season-track.cjs'
      - 'test/seasonTrackOperator.test.js'
      - 'test/seasonTrackRoutes.test.js'
      - 'automation-platform/src/services/seasonTrackService.js'
      - 'automation-platform/test/seasonTrackService.test.js'
      - 'automation-platform/src/routes/websiteSeasonTrackRoutes.js'
      - 'automation-platform/src/index.js'
      - 'server/routes/seasonTrack.js'
      - 'server/services/automationWebsiteClient.js'
      - 'server/index.js'
      - 'public/quests.html'
      - 'public/assets/season-track.*'
      - 'scripts/verify-season-track.cjs'
      - 'server/services/roadmapCommunity.js'
      - 'public/assets/home-roadmap.js'
      - '.github/workflows/season-track.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test automation-platform/test/achievementLifeSource.test.js
      - run: node --test automation-platform/test/seasonAchievementPoints.test.js automation-platform/test/achievementSourceTime.test.js automation-platform/test/seasonTrackService.test.js test/seasonTrackRoutes.test.js automation-platform/test/seasonTrackStore.test.js test/seasonTrackOperator.test.js automation-platform/test/progressionSourceTime.test.js automation-platform/test/progressionService.test.js automation-platform/test/questBoosts.test.js automation-platform/test/questChallengeExpansion.test.js test/valleyLegacyTelemetry.test.js test/roadmapCommunity.test.js test/hvRoadmapIntegration.test.js test/hvUx01NavigationHome.test.js test/productionUiRelease.test.js test/questPolling.test.js
      - run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/verify-season-track.cjs
      - run: node scripts/verify-dynamic-challenges.cjs
