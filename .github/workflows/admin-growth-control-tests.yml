name: Admin Growth Control Tests

on:
  pull_request:
    paths:
      - 'public/adminoperations.html'
      - 'public/assets/adminoperations.js'
      - 'server/routes/adminOperations.js'
      - 'server/services/automationWebsiteClient.js'
      - 'test/adminGrowthControl.test.js'
      - 'automation-platform/src/services/rconControlService.js'
      - 'automation-platform/src/routes/adminRoutes.js'
      - 'automation-platform/test/adminGrowthMultiplierEndpoint.test.js'
      - '.github/workflows/admin-growth-control-tests.yml'

permissions:
  contents: read

jobs:
  test-website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test test/adminGrowthControl.test.js test/adminCorpseWipe.test.js test/adminOperationsRoute.test.js
