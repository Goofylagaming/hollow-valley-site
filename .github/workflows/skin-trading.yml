name: Player skin trading
on:
  pull_request:
    paths:
      - '.env.example'
      - 'automation-platform/.env.example'
      - 'automation-platform/src/index.js'
      - 'automation-platform/src/services/skinMarketModeration.js'
      - 'automation-platform/src/routes/skinMarketModerationRoutes.js'
      - 'automation-platform/test/skinMarketModeration.test.js'
      - 'server/routes/skinMarketModeration.js'
      - 'test/skinMarketModerationHttp.test.js'
      - 'public/adminskinmarket.html'
      - 'public/assets/admin-skin-market.js'
      - 'scripts/verify-skin-market-reviews.cjs'
      - 'automation-platform/src/services/skinTradingService.js'
      - 'automation-platform/src/services/skinTransferEligibility.js'
      - 'automation-platform/src/services/skinGiftService.js'
      - 'automation-platform/src/services/skinParkedApplicationService.js'
      - 'automation-platform/src/services/economyStore.js'
      - 'automation-platform/src/routes/websiteRoutes.js'
      - 'automation-platform/src/routes/skinTradingRoutes.js'
      - 'server/routes/skinTrading.js'
      - 'server/services/skinTradingClient.js'
      - 'server/index.js'
      - 'public/skin-trading.html'
      - 'public/assets/skin-trading.*'
      - 'public/marketplace.html'
      - 'scripts/verify-skin-trading.cjs'
      - 'test/skinTradingHttp.test.js'
      - 'automation-platform/test/skinTrading*.test.js'
      - 'automation-platform/test/skinGift*.test.js'
      - 'server/services/roadmapCommunity.js'
      - 'public/assets/home-roadmap.js'
      - 'test/roadmapCommunity.test.js'
      - '.github/workflows/skin-trading.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DB_PATH: ':memory:'
      AUTOMATION_DB_PATH: ':memory:'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test test/skinMarketModerationHttp.test.js automation-platform/test/skinMarketModeration.test.js test/skinTradingHttp.test.js test/serverEntrypointSyntax.test.js automation-platform/test/skinTrading.test.js automation-platform/test/skinTradingConcurrency.test.js automation-platform/test/skinGift.test.js automation-platform/test/skinGiftConcurrency.test.js automation-platform/test/skinGiftParked.test.js automation-platform/test/skinGiftWear.test.js test/roadmapCommunity.test.js test/hvRoadmapIntegration.test.js test/hvUx01NavigationHome.test.js test/productionUiRelease.test.js
      - run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/verify-skin-trading.cjs
      - run: node scripts/verify-skin-market-reviews.cjs
