name: Player skin trading
on:
  pull_request:
    paths:
      - 'automation-platform/src/services/skinTradingService.js'
      - 'automation-platform/src/services/skinTransferEligibility.js'
      - 'automation-platform/src/services/skinGiftService.js'
      - 'automation-platform/src/services/skinParkedApplicationService.js'
      - 'automation-platform/src/services/economyStore.js'
      - 'automation-platform/test/skinTrading*.test.js'
      - 'automation-platform/test/skinGift*.test.js'
      - 'server/services/roadmapCommunity.js'
      - 'public/assets/home-roadmap.js'
      - 'test/roadmapCommunity.test.js'
      - '.github/workflows/skin-trading.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DB_PATH: ':memory:'
      AUTOMATION_DB_PATH: ':memory:'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test automation-platform/test/skinTrading.test.js automation-platform/test/skinTradingConcurrency.test.js automation-platform/test/skinGift.test.js automation-platform/test/skinGiftConcurrency.test.js automation-platform/test/skinGiftParked.test.js automation-platform/test/skinGiftWear.test.js test/roadmapCommunity.test.js test/hvRoadmapIntegration.test.js test/hvUx01NavigationHome.test.js test/productionUiRelease.test.js
