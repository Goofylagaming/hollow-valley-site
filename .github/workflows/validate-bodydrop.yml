name: Validate BodyDrop Flow

on:
  pull_request:
    paths:
      - "server-mods/BodyDrop/**"
      - "server-mods/CommandBridge/**"
      - "server/routes/bodydrop.js"
      - "server/routes/adminBodyDropReset.js"
      - "server/services/adminBodyDropResetClient.js"
      - "server/index.js"
      - "automation-platform/src/config/bodyDropDiets.js"
      - "automation-platform/src/routes/bodyDropRoutes.js"
      - "automation-platform/src/routes/websiteRoutes.js"
      - "automation-platform/src/services/bodyDropService.js"
      - "automation-platform/src/services/speciesBodyDropService.js"
      - "automation-platform/test/speciesBodyDropDiets.test.js"
      - "public/bodydrop.html"
      - "public/assets/bodydrop.js"
      - "public/assets/mydinos.js"
      - "test/adminBodyDropResetRoute.test.js"
      - "test/adminBodyDropResetFrontend.test.js"
      - "test/legacyDirectGameApiGuard.test.js"
      - ".github/workflows/validate-bodydrop.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install website dependencies
        run: npm ci

      - name: Verify website legacy paths remain retired
        run: node --test test/legacyDirectGameApiGuard.test.js

      - name: Verify admin BodyDrop reset UI and route
        run: node --test test/adminBodyDropResetRoute.test.js test/adminBodyDropResetFrontend.test.js

      - name: Run species diet tests
        run: node --test automation-platform/test/speciesBodyDropDiets.test.js

      - name: Validate Lua syntax and bd routing
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.4
          luac -p server-mods/CommandBridge/Scripts/main.lua
          luac -p server-mods/BodyDrop/Scripts/main.lua
          grep -Fq 'if verb == "bd" then' server-mods/CommandBridge/Scripts/main.lua
          grep -Fq '/BodyDrop/Saved/inbox.ndjson' server-mods/CommandBridge/Scripts/main.lua
