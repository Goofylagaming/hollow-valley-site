name: Staff-reviewed status incidents
on:
  pull_request:
    paths:
      - 'server/services/statusIncidentStore.js'
      - 'server/routes/statusIncidents.js'
      - 'server/index.js'
      - 'public/status.html'
      - 'public/adminstatus.html'
      - 'public/adminincidents.html'
      - 'public/partials/nav.html'
      - 'public/assets/status-editor.*'
      - 'public/assets/status-incidents.js'
      - 'public/assets/status-page.*'
      - 'public/assets/home-roadmap.js'
      - 'test/statusIncidents*.test.js'
      - 'test/statusPage.test.js'
      - 'test/incidentTimeline.test.js'
      - 'scripts/verify-status-incidents.cjs'
      - 'scripts/verify-status-editor.cjs'
      - '.github/workflows/status-incidents.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test test/statusIncidents.test.js test/statusIncidentsHttp.test.js test/statusPage.test.js test/incidentTimeline.test.js test/hvRoadmapIntegration.test.js test/hvUx01NavigationHome.test.js test/productionUiRelease.test.js test/roadmapCommunity.test.js
      - run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/verify-status-incidents.cjs
      - run: node scripts/verify-status-editor.cjs
