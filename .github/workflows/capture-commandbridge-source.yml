name: Capture CommandBridge source

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/capture-commandbridge-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch live managed CommandBridge
        shell: bash
        env:
          FTP_HOST: ${{ secrets.VERYGAMES_FTP_HOST }}
          FTP_PORT: ${{ secrets.VERYGAMES_FTP_PORT }}
          FTP_USER: ${{ secrets.VERYGAMES_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.VERYGAMES_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y lua5.4 lftp
          mkdir -p server-mods/CommandBridge/Scripts
          lftp -c "
            set cmd:fail-exit yes;
            set ssl:verify-certificate no;
            set net:max-retries 3;
            open -p \"$FTP_PORT\" -u \"$FTP_USER\",\"$FTP_PASS\" \"$FTP_HOST\";
            get /TheIsle/Binaries/Win64/ue4ss/Mods/CommandBridge/Scripts/main.lua -o server-mods/CommandBridge/Scripts/main.lua;
            bye;
          "
          luac -p server-mods/CommandBridge/Scripts/main.lua
          grep -q 'MOD_VERSION = "v002"' server-mods/CommandBridge/Scripts/main.lua

      - name: Commit source snapshot
        shell: bash
        run: |
          git config user.name "Goofylagaming"
          git config user.email "goofylagaming@hotmail.com"
          git add server-mods/CommandBridge/Scripts/main.lua
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Track live CommandBridge HTTP source"
          git pull --rebase origin master
          git push origin HEAD:master
