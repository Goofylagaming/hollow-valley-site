name: Production stability checks
on:
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test test/hvUx01NavigationHome.test.js test/dinoNavigationSeparation.test.js test/primalboundNavigation.test.js test/productionStability.test.js test/primalboundGateway.test.js test/serverStatusAutomationOnly.test.js test/automationBranchSyncConfig.test.js automation-platform/test/economyWallet.test.js automation-platform/test/progressionService.test.js automation-platform/test/commandBridge.test.js automation-platform/test/dinoStorageCompatibility.test.js automation-platform/test/serverMonitor.test.js
