name: Bootstrap CommandBridge HTTP pull

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/bootstrap-commandbridge-http.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.4 lftp

      - name: Fetch live CommandBridge and apply HTTP patch
        shell: bash
        env:
          FTP_HOST: ${{ secrets.VERYGAMES_FTP_HOST }}
          FTP_PORT: ${{ secrets.VERYGAMES_FTP_PORT }}
          FTP_USER: ${{ secrets.VERYGAMES_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.VERYGAMES_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p server-mods/CommandBridge/Scripts predeploy-backup
          lftp -c "
            set cmd:fail-exit yes;
            set ssl:verify-certificate no;
            set net:max-retries 3;
            open -p \"$FTP_PORT\" -u \"$FTP_USER\",\"$FTP_PASS\" \"$FTP_HOST\";
            get /TheIsle/Binaries/Win64/ue4ss/Mods/CommandBridge/Scripts/main.lua -o server-mods/CommandBridge/Scripts/main.lua;
            get /TheIsle/Binaries/Win64/ue4ss/Mods/CommandBridge/Scripts/main.lua -o predeploy-backup/main.lua;
            bye;
          "
          git apply server-mods/CommandBridge/http-pull.patch
          luac -p server-mods/CommandBridge/Scripts/main.lua

      - name: Create permanent deploy workflow
        shell: bash
        run: |
          cat > .github/workflows/deploy-commandbridge.yml <<'EOF'
          name: Deploy CommandBridge Mod

          on:
            push:
              branches:
                - master
              paths:
                - "server-mods/CommandBridge/Scripts/main.lua"
                - ".github/workflows/deploy-commandbridge.yml"
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            deploy:
              runs-on: ubuntu-latest
              steps:
                - name: Checkout
                  uses: actions/checkout@v4

                - name: Validate Lua and install FTP client
                  run: |
                    sudo apt-get update -qq
                    sudo apt-get install -y lua5.4 lftp
                    luac -p server-mods/CommandBridge/Scripts/main.lua

                - name: Backup and deploy CommandBridge HTTP config
                  shell: bash
                  env:
                    FTP_HOST: ${{ secrets.VERYGAMES_FTP_HOST }}
                    FTP_PORT: ${{ secrets.VERYGAMES_FTP_PORT }}
                    FTP_USER: ${{ secrets.VERYGAMES_FTP_USERNAME }}
                    FTP_PASS: ${{ secrets.VERYGAMES_FTP_PASSWORD }}
                  run: |
                    set -euo pipefail
                    mkdir -p predeploy-backup
                    TOKEN=$(FTP_PASS="$FTP_PASS" node -e 'const c=require("node:crypto");process.stdout.write(c.createHash("sha256").update("hds-commandbridge-http-v1\0").update(process.env.FTP_PASS).digest("hex"))')
                    printf '%s\n' "{\"enabled\":true,\"inputPollSeconds\":1,\"inputMode\":\"http\",\"inputUrl\":\"https://hollowvalley.herbydeathsquadgames.com/api/internal/commandbridge/poll\",\"inputAuthHeader\":\"Authorization: Bearer $TOKEN\",\"resultUrl\":\"https://hollowvalley.herbydeathsquadgames.com/api/internal/commandbridge/result\"}" > /tmp/commandbridge-config.json
                    date +%s > /tmp/reload.flag
                    lftp -c "
                      set cmd:fail-exit yes;
                      set ssl:verify-certificate no;
                      set net:max-retries 3;
                      open -p \"$FTP_PORT\" -u \"$FTP_USER\",\"$FTP_PASS\" \"$FTP_HOST\";
                      get /TheIsle/Binaries/Win64/ue4ss/Mods/CommandBridge/Scripts/main.lua -o predeploy-backup/main.lua;
                      put server-mods/CommandBridge/Scripts/main.lua -o /TheIsle/Binaries/Win64/ue4ss/Mods/CommandBridge/Scripts/main.lua;
                      put /tmp/commandbridge-config.json -o /TheIsle/Binaries/Win64/ue4ss/Mods/CommandBridge/Saved/config.json;
                      put /tmp/reload.flag -o /TheIsle/Binaries/Win64/ue4ss/Mods/CommandBridge/Saved/reload.flag;
                      bye;
                    "

                - name: Upload pre-deploy backup
                  uses: actions/upload-artifact@v4
                  with:
                    name: commandbridge-predeploy-${{ github.sha }}
                    path: predeploy-backup/main.lua
                    if-no-files-found: error
                    retention-days: 90
          EOF

      - name: Deploy patched CommandBridge and private config
        shell: bash
        env:
          FTP_HOST: ${{ secrets.VERYGAMES_FTP_HOST }}
          FTP_PORT: ${{ secrets.VERYGAMES_FTP_PORT }}
          FTP_USER: ${{ secrets.VERYGAMES_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.VERYGAMES_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          TOKEN=$(FTP_PASS="$FTP_PASS" node -e 'const c=require("node:crypto");process.stdout.write(c.createHash("sha256").update("hds-commandbridge-http-v1\0").update(process.env.FTP_PASS).digest("hex"))')
          printf '%s\n' "{\"enabled\":true,\"inputPollSeconds\":1,\"inputMode\":\"http\",\"inputUrl\":\"https://hollowvalley.herbydeathsquadgames.com/api/internal/commandbridge/poll\",\"inputAuthHeader\":\"Authorization: Bearer $TOKEN\",\"resultUrl\":\"https://hollowvalley.herbydeathsquadgames.com/api/internal/commandbridge/result\"}" > /tmp/commandbridge-config.json
          date +%s > /tmp/reload.flag
          lftp -c "
            set cmd:fail-exit yes;
            set ssl:verify-certificate no;
            set net:max-retries 3;
            open -p \"$FTP_PORT\" -u \"$FTP_USER\",\"$FTP_PASS\" \"$FTP_HOST\";
            put server-mods/CommandBridge/Scripts/main.lua -o /TheIsle/Binaries/Win64/ue4ss/Mods/CommandBridge/Scripts/main.lua;
            put /tmp/commandbridge-config.json -o /TheIsle/Binaries/Win64/ue4ss/Mods/CommandBridge/Saved/config.json;
            put /tmp/reload.flag -o /TheIsle/Binaries/Win64/ue4ss/Mods/CommandBridge/Saved/reload.flag;
            bye;
          "

      - name: Commit managed CommandBridge source
        shell: bash
        run: |
          rm -f .github/workflows/bootstrap-commandbridge-http.yml
          rm -f server-mods/CommandBridge/http-pull.patch
          git config user.name "Goofylagaming"
          git config user.email "goofylagaming@hotmail.com"
          git add -A
          git commit -m "Use HTTP pull transport for CommandBridge"
          git push origin HEAD:master

      - name: Upload bootstrap backup
        uses: actions/upload-artifact@v4
        with:
          name: commandbridge-http-bootstrap-backup-${{ github.sha }}
          path: predeploy-backup/main.lua
          if-no-files-found: error
          retention-days: 90
