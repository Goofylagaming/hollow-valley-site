name: Primalbound Paid Preview Lockfile Sync

on:
  push:
    branches:
      - feature/primalbound-shared-paid-preview-20261020
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate consistent package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile if needed
        run: |
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Keep preview lockfile consistent with Primalbound backend dependencies"
            git push origin HEAD:feature/primalbound-shared-paid-preview-20261020
          fi
