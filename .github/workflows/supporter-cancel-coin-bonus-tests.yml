name: Supporter Cancellation Coin Bonus Tests

on:
  pull_request:
    paths:
      - 'server/db.js'
      - 'server/routes/supporter.js'
      - 'server/routes/supporterInternal.js'
      - 'server/routes/dashboard.js'
      - 'server/services/supporterWebhook.js'
      - 'server/services/supporterCoinBonus.js'
      - 'automation-platform/src/services/supporterBonusService.js'
      - 'test/supporterInternalRoute.test.js'
      - 'test/supporterWebhook.test.js'
      - 'test/supporterCoinBonus.test.js'
      - 'test/supporterManageRoute.test.js'
      - 'automation-platform/test/supporterBonus.test.js'
      - '.github/workflows/supporter-cancel-coin-bonus-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test test/supporterInternalRoute.test.js test/supporterWebhook.test.js test/supporterCoinBonus.test.js test/supporterManageRoute.test.js automation-platform/test/supporterBonus.test.js
