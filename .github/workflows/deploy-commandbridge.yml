name: Deploy CommandBridge Mod

on:
  push:
    branches:
      - master
    paths:
      - "server-mods/CommandBridge/Scripts/main.lua"
      - ".github/workflows/deploy-commandbridge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Lua and install FTP client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.4 lftp
          luac -p server-mods/CommandBridge/Scripts/main.lua

      - name: Backup and deploy CommandBridge file config
        shell: bash
        env:
          FTP_HOST: ${{ secrets.VERYGAMES_FTP_HOST }}
          FTP_PORT: ${{ secrets.VERYGAMES_FTP_PORT }}
          FTP_USER: ${{ secrets.VERYGAMES_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.VERYGAMES_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p predeploy-backup
          printf '%s\n' '{"enabled":true,"inputPollSeconds":1,"inputMode":"file","inputUrl":"","inputAuthHeader":"","resultUrl":""}' > /tmp/commandbridge-config.json
          date +%s > /tmp/reload.flag
          lftp -c "
            set cmd:fail-exit yes;
            set ssl:verify-certificate no;
            set net:max-retries 3;
            open -p \"$FTP_PORT\" -u \"$FTP_USER\",\"$FTP_PASS\" \"$FTP_HOST\";
            get /TheIsle/Binaries/Win64/ue4ss/Mods/CommandBridge/Scripts/main.lua -o predeploy-backup/main.lua;
            put server-mods/CommandBridge/Scripts/main.lua -o /TheIsle/Binaries/Win64/ue4ss/Mods/CommandBridge/Scripts/main.lua;
            put /tmp/commandbridge-config.json -o /TheIsle/Binaries/Win64/ue4ss/Mods/CommandBridge/Saved/config.json;
            put /tmp/reload.flag -o /TheIsle/Binaries/Win64/ue4ss/Mods/CommandBridge/Saved/reload.flag;
            bye;
          "

      - name: Upload pre-deploy backup
        uses: actions/upload-artifact@v4
        with:
          name: commandbridge-predeploy-${{ github.sha }}
          path: predeploy-backup/main.lua
          if-no-files-found: error
          retention-days: 90
