name: Validate DinoStorage Park Corpse

on:
  pull_request:
    paths:
      - "server-mods/DinoStorage/Scripts/main.lua"
      - "test/dinoStorageParkCorpse.test.js"
      - ".github/workflows/validate-dinostorage-park.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate parking corpse contract
        run: node --test test/dinoStorageParkCorpse.test.js
      - name: Install Lua
        run: sudo apt-get update -qq && sudo apt-get install -y lua5.4
      - name: Validate DinoStorage Lua syntax
        run: luac -p server-mods/DinoStorage/Scripts/main.lua
