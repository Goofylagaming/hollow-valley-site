name: Validate DinoStorage Automation Flow

on:
  pull_request:
    paths:
      - "server-mods/DinoStorage/Scripts/main.lua"
      - "automation-platform/src/services/dinoStorageService.js"
      - "automation-platform/src/routes/binaryLaneCommandBridgeRoutes.js"
      - "automation-platform/test/dinoStorageCompatibility.test.js"
      - "automation-platform/test/dinoStorageHttpReconcile.test.js"
      - "automation-platform/test/dinoStorageList.test.js"
      - ".github/workflows/validate-dinostorage-park.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install automation dependencies
        run: cd automation-platform && npm install --ignore-scripts --no-audit --no-fund
      - name: Validate automation-owned DinoStorage flow
        run: >-
          cd automation-platform && node --test
          test/dinoStorageCompatibility.test.js
          test/dinoStorageHttpReconcile.test.js
          test/dinoStorageList.test.js
      - name: Install Lua
        run: sudo apt-get update -qq && sudo apt-get install -y lua5.4
      - name: Validate DinoStorage Lua syntax
        run: luac -p server-mods/DinoStorage/Scripts/main.lua
