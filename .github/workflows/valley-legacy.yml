name: Valley Legacy release checks
on:
  pull_request:
    paths: ['automation-platform/**', 'server/**', 'public/legacy.html', 'public/assets/legacy*', 'test/valleyLegacy*', 'test/journeysHttp.test.js', 'test/discoveryHttp.test.js', 'test/discoveryCandidates.test.js', 'scripts/build-discovery-candidates.cjs', 'scripts/register-discovery-catalog.cjs', 'test/discoveryRegistration.test.js', '.github/workflows/valley-legacy.yml']
  push:
    branches: ['feature/valley-legacy-systems']
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --test test/discoveryRegistration.test.js test/discoveryCandidates.test.js test/discoveryHttp.test.js automation-platform/test/discoveryCatalog.test.js automation-platform/test/discoveryVisitStore.test.js test/journeysHttp.test.js automation-platform/test/journeyStore.test.js automation-platform/test/journeyMaintenance.test.js test/valleyLegacy*.test.js test/ownerEmailAuth.test.js test/restartTelemetry.test.js automation-platform/test/migrationReadiness.test.js automation-platform/test/websiteAuth.test.js automation-platform/test/playerPresence.test.js automation-platform/test/presenceFeedEndpoint.test.js
