name: Membership Tests

on:
  push:
    branches:
      - master
      - release-memberships-20260919
    paths:
      - 'server/**'
      - 'public/supporter.html'
      - 'public/assets/supporter.js'
      - 'test/supporter*.test.js'
      - 'test/discordMembership.test.js'
      - 'test/discordEvents.test.js'
      - 'test/adminRestoreRoute.test.js'
      - 'test/adminOperationsRoute.test.js'
      - 'test/roadmapFrontend.test.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/membership-tests.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'server/**'
      - 'public/supporter.html'
      - 'public/assets/supporter.js'
      - 'test/supporter*.test.js'
      - 'test/discordMembership.test.js'
      - 'test/adminRestoreRoute.test.js'
      - 'test/adminOperationsRoute.test.js'
      - 'test/roadmapFrontend.test.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/membership-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run membership tests
        run: node --test test/supporterCheckout.test.js test/supporterWebhook.test.js test/supporterManage.test.js test/supporterManageRoute.test.js test/supporterReconcile.test.js test/discordMembership.test.js test/discordEvents.test.js test/adminRestoreRoute.test.js test/adminOperationsRoute.test.js test/roadmapFrontend.test.js test/supporterInternalRoute.test.js
