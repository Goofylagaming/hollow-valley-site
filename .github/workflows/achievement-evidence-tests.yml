name: Achievement evidence
on:
  pull_request:
    paths:
      - 'automation-platform/src/config/combatSpecies.js'
      - 'automation-platform/src/services/combatEventService.js'
      - 'automation-platform/src/services/progressionService.js'
      - 'automation-platform/src/services/progressionRules.js'
      - 'automation-platform/src/services/achievementProgressionSource.js'
      - 'automation-platform/test/achievementProgressionSource.test.js'
      - 'automation-platform/src/services/progressionSourceTime.js'
      - 'automation-platform/src/services/achievementSourceTime.js'
      - 'scripts/review-season-track.cjs'
      - 'automation-platform/src/services/seasonTrackInspection.js'
      - 'test/seasonTrackHealth.test.js'
      - 'automation-platform/src/services/seasonTrackStore.js'
      - 'automation-platform/src/services/seasonTrackService.js'
      - 'automation-platform/test/seasonTrackCollection*.test.js'
      - 'automation-platform/src/services/skinOwnershipSource.js'
      - 'automation-platform/src/services/economyStore.js'
      - 'automation-platform/src/services/skinPresetService.js'
      - 'automation-platform/test/skinOwnershipSource.test.js'
      - 'automation-platform/test/skinOwnershipSeason.test.js'
      - 'automation-platform/test/skinPresets.test.js'
      - 'automation-platform/test/skinGift*.test.js'
      - 'automation-platform/test/skinPromo*.test.js'
      - 'automation-platform/test/premiumSkins*.test.js'
      - 'automation-platform/src/services/primeObservationStore.js'
      - 'automation-platform/src/services/playerPresenceService.js'
      - 'automation-platform/test/primeObservationSource.test.js'
      - 'automation-platform/test/primeZoneReset.test.js'
      - 'automation-platform/test/playerPresence.test.js'
      - 'automation-platform/test/presenceFeedEndpoint.test.js'
      - 'test/primePresenceClock.test.js'
      - 'automation-platform/src/services/achievementLifeSource.js'
      - 'automation-platform/src/services/achievementBattleSource.js'
      - 'automation-platform/test/achievementBattleSource.test.js'
      - 'automation-platform/test/achievementLifeSource.test.js'
      - 'automation-platform/test/achievementSourceTime.test.js'
      - 'automation-platform/test/progressionSourceTime.test.js'
      - 'automation-platform/src/services/achievementEvidenceReview.js'
      - 'automation-platform/src/routes/achievementReviewRoutes.js'
      - 'automation-platform/test/achievementReview.test.js'
      - 'automation-platform/test/combat*.test.js'
      - 'automation-platform/test/progressionService.test.js'
      - 'automation-platform/test/primeAchievement.test.js'
      - 'automation-platform/test/nestedAdultAchievement.test.js'
      - 'automation-platform/test/lifeSurvivalAchievement.test.js'
      - 'automation-platform/src/services/valleyLegacyStore.js'
      - 'automation-platform/src/services/valleyLegacyService.js'
      - 'automation-platform/src/services/territoryLegacyRecords.js'
      - 'automation-platform/test/territoryLegacyRecords.test.js'
      - 'automation-platform/src/services/primeTrackerService.js'
      - 'automation-platform/src/services/territoryVictoryStore.js'
      - 'automation-platform/src/routes/websiteTerritoryResultRoutes.js'
      - 'automation-platform/test/territoryVictoryResults.test.js'
      - 'server/services/territoryVictoryOutbox.js'
      - 'server/services/automationWebsiteClient.js'
      - 'test/territoryVictoryDelivery.test.js'
      - 'test/territoryVictoryRuntime.test.js'
      - 'test/territoryVictoryReview.test.js'
      - 'server/routes/territoryVictoryReview.js'
      - 'server/routes/achievementReview.js'
      - 'server/routes/adminOperations.js'
      - 'test/achievementReviewHttp.test.js'
      - 'public/adminoperations.html'
      - 'public/assets/achievement-review.js'
      - 'public/assets/territory-victory-review.js'
      - 'server/services/territoryBattleProvenance.js'
      - 'server/routes/territoryWars.js'
      - 'test/territoryBattleProvenance.test.js'
      - 'scripts/game-combat-line.js'
      - 'test/gameCombatLine.test.js'
      - '.github/workflows/achievement-evidence-tests.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test automation-platform/test/achievementProgressionSource.test.js
      - run: node --test automation-platform/test/achievementBattleSource.test.js
      - run: node --test automation-platform/test/achievementLifeSource.test.js
      - run: node --test test/seasonTrackHealth.test.js
      - run: node --test automation-platform/test/seasonTrackCollection.test.js automation-platform/test/seasonTrackCollectionRuntime.test.js automation-platform/test/seasonTrackCollectionConcurrency.test.js
      - run: node --test automation-platform/test/skinOwnershipSource.test.js automation-platform/test/skinOwnershipSeason.test.js automation-platform/test/skinPresets.test.js automation-platform/test/skinGift.test.js automation-platform/test/skinGiftConcurrency.test.js automation-platform/test/skinPromo.test.js automation-platform/test/skinPromoConcurrency.test.js automation-platform/test/premiumSkins.test.js automation-platform/test/premiumSkinsReview.test.js
      - run: node --test automation-platform/test/primeObservationSource.test.js automation-platform/test/primeAchievement.test.js automation-platform/test/primeZoneReset.test.js automation-platform/test/playerPresence.test.js automation-platform/test/presenceFeedEndpoint.test.js test/primePresenceClock.test.js
      - run: node --test automation-platform/test/achievementSourceTime.test.js
      - run: node --test automation-platform/test/progressionSourceTime.test.js automation-platform/test/territoryLegacyRecords.test.js test/achievementReviewHttp.test.js automation-platform/test/achievementReview.test.js test/territoryVictoryReview.test.js test/territoryVictoryRuntime.test.js test/territoryVictoryDelivery.test.js automation-platform/test/territoryVictoryResults.test.js test/territoryBattleProvenance.test.js test/territoryAdminHttp.test.js test/territoryAdminRelease.test.js test/territoryControl.test.js automation-platform/test/lifeSurvivalAchievement.test.js automation-platform/test/nestedAdultAchievement.test.js test/valleyLegacy.test.js automation-platform/test/primeAchievement.test.js test/gameCombatLine.test.js automation-platform/test/combatSpeciesAchievements.test.js automation-platform/test/combatEventService.test.js automation-platform/test/combatRoutes.test.js automation-platform/test/combatCalendarReset.test.js automation-platform/test/progressionService.test.js
