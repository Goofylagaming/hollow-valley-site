name: Achievement evidence
on:
  pull_request:
    paths:
      - 'automation-platform/src/config/combatSpecies.js'
      - 'automation-platform/src/services/combatEventService.js'
      - 'automation-platform/src/services/progressionService.js'
      - 'automation-platform/test/combat*.test.js'
      - 'automation-platform/test/progressionService.test.js'
      - 'automation-platform/test/primeAchievement.test.js'
      - 'automation-platform/test/nestedAdultAchievement.test.js'
      - 'automation-platform/test/lifeSurvivalAchievement.test.js'
      - 'automation-platform/src/services/valleyLegacyStore.js'
      - 'automation-platform/src/services/primeTrackerService.js'
      - 'automation-platform/src/services/territoryVictoryStore.js'
      - 'automation-platform/src/routes/websiteTerritoryResultRoutes.js'
      - 'automation-platform/test/territoryVictoryResults.test.js'
      - 'server/services/territoryBattleProvenance.js'
      - 'server/routes/territoryWars.js'
      - 'test/territoryBattleProvenance.test.js'
      - 'scripts/game-combat-line.js'
      - 'test/gameCombatLine.test.js'
      - '.github/workflows/achievement-evidence-tests.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test automation-platform/test/territoryVictoryResults.test.js test/territoryBattleProvenance.test.js test/territoryAdminHttp.test.js test/territoryAdminRelease.test.js test/territoryControl.test.js automation-platform/test/lifeSurvivalAchievement.test.js automation-platform/test/nestedAdultAchievement.test.js test/valleyLegacy.test.js automation-platform/test/primeAchievement.test.js test/gameCombatLine.test.js automation-platform/test/combatSpeciesAchievements.test.js automation-platform/test/combatEventService.test.js automation-platform/test/combatRoutes.test.js automation-platform/test/combatCalendarReset.test.js automation-platform/test/progressionService.test.js
