name: Arcade Rewards Tests
on:
  pull_request:
    paths: ['automation-platform/**', 'server/**', 'public/**', 'test/arcadeRewards*', '.github/workflows/arcade-rewards-tests.yml']
  push:
    branches: [master]
    paths: ['automation-platform/**', 'server/**', 'public/**', 'test/arcadeRewards*', '.github/workflows/arcade-rewards-tests.yml']
permissions:
  contents: read
jobs:
  rewards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test test/arcadeRewardsRoute.test.js test/membershipExpansionStaging.test.js automation-platform/test/arcadeRewards.test.js automation-platform/test/arcadeRewardsConcurrency.test.js automation-platform/test/arcadeSkinCatalog.test.js automation-platform/test/valleyArcade.test.js automation-platform/test/expansionWalletConcurrency.test.js
