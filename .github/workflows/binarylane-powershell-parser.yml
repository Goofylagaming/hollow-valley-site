name: BinaryLane Windows PowerShell syntax check

on:
  pull_request:
    branches: [master]
    paths:
      - 'scripts/windows/HollowValley-ServerManagementAgent.ps1'
      - 'scripts/windows/Install-HollowValley-ServerManagement.ps1'
      - 'scripts/windows/Initialize-HVProductionManagementToken.ps1'
      - 'scripts/windows/Switch-HollowValleyManagementToProduction.ps1'
      - 'scripts/windows/Set-HollowValley-ManagementWriteMode.ps1'
      - '.github/workflows/binarylane-powershell-parser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parser:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Parse Windows scripts using Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $paths = @(
            'scripts/windows/HollowValley-ServerManagementAgent.ps1'
            'scripts/windows/Install-HollowValley-ServerManagement.ps1',
            'scripts/windows/Initialize-HVProductionManagementToken.ps1',
            'scripts/windows/Switch-HollowValleyManagementToProduction.ps1',
            'scripts/windows/Set-HollowValley-ManagementWriteMode.ps1'
          )
          foreach ($path in $paths) {
            $tokens = $null
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $path).Path,
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              foreach ($errorItem in $errors) {
                Write-Error ("{0}: {1}" -f $path, $errorItem.Message)
              }
              throw ("PowerShell parse failed for " + $path)
            }
            Write-Host ("PowerShell parser PASS: " + $path)
          }
          $agent = Get-Content 'scripts/windows/HollowValley-ServerManagementAgent.ps1' -Raw
          if (([regex]::Matches($agent, 'function Get-Snapshot')).Count -ne 1) {
            throw 'Management agent duplicated Get-Snapshot function.'
          }
          if (([regex]::Matches($agent, 'function Invoke-ApprovedTaskAction')).Count -ne 1) {
            throw 'Management agent duplicated write action function.'
          }
          $installer = Get-Content 'scripts/windows/Install-HollowValley-ServerManagement.ps1' -Raw
          if ($installer -notmatch 'Parameter\(Mandatory\s*=\s*\$true\)') {
            throw 'Management installer must require explicit SiteUrl.'
          }
          if ($installer -notmatch 'hollow-valley-management-staging.onrender.com') {
            throw 'Management installer must support staging.'
          }
          if ($installer -notmatch '\-SiteUrl') {
            throw 'Management scheduled task must forward SiteUrl.'
          }
          if ($installer -notmatch '\-TokenFile') {
            throw 'Management installer must include per-environment token file.'
          }
          if ($agent -notmatch 'if \(\-not \$AllowTaskWrites\)') {
            throw 'Management agent must be read-only by default.'
          }
          $cutover = Get-Content 'scripts/windows/Switch-HollowValleyManagementToProduction.ps1' -Raw
          if ($cutover -notmatch 'Disable-ScheduledTask -TaskName \$stagingName' -or
              $cutover -notmatch 'Enable-ScheduledTask -TaskName \$stagingName') {
            throw 'Cutover must stop staging and implement automatic rollback.'
          }
          $probeIndex = $cutover.IndexOf('/api/binarylane-management/probe')
          $stopIndex = $cutover.IndexOf('Stop-ScheduledTask -TaskName $stagingName')
          if ($probeIndex -lt 0 -or $stopIndex -lt 0 -or $probeIndex -ge $stopIndex) {
            throw 'Production auth probe must occur before staging task is stopped.'
          }
          if ($cutover -notmatch 'endpoint must be healthy with writes DISABLED') {
            throw 'Cutover must refuse a production endpoint with writes enabled.'
          }
          $mode = Get-Content 'scripts/windows/Set-HollowValley-ManagementWriteMode.ps1' -Raw
          if ($mode -notmatch 'ENABLE LIMITED PROD TASK ACTIONS' -or
              $mode -notmatch 'Stop-ScheduledTask -TaskName \$taskName') {
            throw 'Local write activation must require explicit confirmation and restart only its own task.'
          }
