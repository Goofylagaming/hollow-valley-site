name: Membership Rewards Tests

on:
  pull_request:
    branches: [master, 'feature/hv-roadmap-*']
    paths:
      - 'server/**'
      - 'automation-platform/src/**'
      - 'automation-platform/test/**'
      - 'public/**'
      - 'test/**'
      - '.github/workflows/membership-rewards-tests.yml'
  push:
    branches: [master, 'feature/membership-rewards-*']
    paths:
      - 'server/**'
      - 'automation-platform/src/**'
      - 'automation-platform/test/**'
      - 'public/**'
      - 'test/**'
      - '.github/workflows/membership-rewards-tests.yml'

permissions:
  contents: read

jobs:
  membership-rewards:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify rewards, entitlement and permanent ownership
        # Each test process gets its own SQLite database instead of racing
        # other suites to initialize the repository's default database file.
        env:
          DB_PATH: ":memory:"
        run: >-
          node --test test/skinGiftsRoute.test.js test/skinPromosRoute.test.js automation-platform/test/skinGift.test.js automation-platform/test/skinGiftConcurrency.test.js automation-platform/test/skinGiftWear.test.js automation-platform/test/skinGiftParked.test.js automation-platform/test/skinParkedPublish.test.js automation-platform/test/skinParkedRestart.test.js automation-platform/test/skinPromo.test.js automation-platform/test/skinPromoConcurrency.test.js test/membership*.test.js test/premiumSkinsRoute.test.js
          test/subscriber*.test.js test/adminSupportGoalDraft.test.js test/financeOwner.test.js test/stripeFinance.test.js
          test/supporterWebhook.test.js test/supporterCoinBonus.test.js test/supporterInternalRoute.test.js
          test/supporterManageRoute.test.js test/discordMembership.test.js
          test/skinStudioSafety.test.js test/skinShareCodeRedaction.test.js test/skinsAdminOnly.test.js
          test/roadmapCommunity.test.js test/roadmapFrontend.test.js
          automation-platform/test/premiumSkins.test.js
          automation-platform/test/membershipStorageCapacity.test.js
          automation-platform/test/premiumSkinsReview.test.js
          automation-platform/test/dinoStorageCompatibility.test.js
          automation-platform/test/skinPresets.test.js automation-platform/test/skinWearService.test.js
