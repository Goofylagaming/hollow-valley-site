name: Bootstrap DinoStorage v003

on:
  push:
    branches:
      - master
    paths:
      - "patches/dinostorage-v003/part-*"
      - ".github/workflows/bootstrap-dinostorage-v003.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Lua and FTP tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.4 lftp

      - name: Download current DinoStorage and keep a backup
        shell: bash
        env:
          FTP_HOST: ${{ secrets.VERYGAMES_FTP_HOST }}
          FTP_PORT: ${{ secrets.VERYGAMES_FTP_PORT }}
          FTP_USER: ${{ secrets.VERYGAMES_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.VERYGAMES_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p server-mods/DinoStorage/Scripts predeploy-backup
          lftp -c "
            set cmd:fail-exit yes;
            set ssl:verify-certificate no;
            set net:max-retries 3;
            open -p \"$FTP_PORT\" -u \"$FTP_USER\",\"$FTP_PASS\" \"$FTP_HOST\";
            get /TheIsle/Binaries/Win64/ue4ss/Mods/DinoStorage/Scripts/main.lua -o predeploy-backup/main.lua;
            bye;
          "
          cp predeploy-backup/main.lua server-mods/DinoStorage/Scripts/main.lua

      - name: Apply v003 patch and validate Lua
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'MOD_VERSION = "v003"' server-mods/DinoStorage/Scripts/main.lua; then
            echo "Live DinoStorage is already v003; using it as the managed copy."
          else
            grep -q 'MOD_VERSION = "v002"' server-mods/DinoStorage/Scripts/main.lua
            cat patches/dinostorage-v003/part-* > /tmp/dinostorage-v003.patch
            git apply --check /tmp/dinostorage-v003.patch
            git apply /tmp/dinostorage-v003.patch
          fi
          luac -p server-mods/DinoStorage/Scripts/main.lua
          grep -q 'MOD_VERSION = "v003"' server-mods/DinoStorage/Scripts/main.lua

      - name: Deploy v003 to VeryGames
        shell: bash
        env:
          FTP_HOST: ${{ secrets.VERYGAMES_FTP_HOST }}
          FTP_PORT: ${{ secrets.VERYGAMES_FTP_PORT }}
          FTP_USER: ${{ secrets.VERYGAMES_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.VERYGAMES_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          lftp -c "
            set cmd:fail-exit yes;
            set ssl:verify-certificate no;
            set net:max-retries 3;
            open -p \"$FTP_PORT\" -u \"$FTP_USER\",\"$FTP_PASS\" \"$FTP_HOST\";
            put server-mods/DinoStorage/Scripts/main.lua -o /TheIsle/Binaries/Win64/ue4ss/Mods/DinoStorage/Scripts/main.lua;
            bye;
          "

      - name: Track managed DinoStorage source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Goofylagaming"
          git config user.email "goofylagaming@hotmail.com"
          git add server-mods/DinoStorage/Scripts/main.lua
          if git diff --cached --quiet; then
            echo "Managed DinoStorage copy is already current."
          else
            git commit -m "Track DinoStorage v003 server mod"
            git push origin HEAD:master
          fi

      - name: Upload pre-v003 backup
        uses: actions/upload-artifact@v4
        with:
          name: dinostorage-pre-v003-${{ github.sha }}
          path: predeploy-backup/main.lua
          if-no-files-found: error
          retention-days: 90
