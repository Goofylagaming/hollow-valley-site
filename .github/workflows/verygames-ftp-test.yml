name: VeryGames FTP Connection Test

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/verygames-ftp-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-ftp:
    runs-on: ubuntu-latest
    steps:
      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y lftp

      - name: Test VeryGames FTP login
        shell: bash
        env:
          FTP_HOST: ${{ secrets.VERYGAMES_FTP_HOST }}
          FTP_PORT: ${{ secrets.VERYGAMES_FTP_PORT }}
          FTP_USER: ${{ secrets.VERYGAMES_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.VERYGAMES_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          lftp -c "
            set cmd:fail-exit yes;
            set ssl:verify-certificate no;
            open -p \"$FTP_PORT\" -u \"$FTP_USER\",\"$FTP_PASS\" \"$FTP_HOST\";
            pwd;
            cls -1 > /dev/null;
            bye;
          "
          echo "VeryGames FTP connection succeeded."
