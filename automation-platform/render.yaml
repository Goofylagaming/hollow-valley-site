# Render Blueprint reference for the authoritative Hollow Valley automation service.
#
# Architecture:
#   Website -> hollow-valley-automation -> BinaryLane agent
#           -> local RCON / UE4SS CommandBridge -> The Isle
#
# The live service is intentionally separate from hollow-valley-site and has
# auto-deploy disabled. Feature-specific runtime flags are managed explicitly in
# Render and are not frozen here as migration-era false/300000 defaults.

services:
  - type: web
    name: hollow-valley-automation
    runtime: node
    rootDir: automation-platform
    plan: starter
    autoDeploy: false
    buildCommand: npm install --omit=dev --no-audit --no-fund
    startCommand: mkdir -p /var/data /var/data/backups && npm start
    healthCheckPath: /health
    disk:
      name: hollow-valley-automation-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTOMATION_DB_PATH
        value: /var/data/automation.sqlite

      # Server-to-server credentials. Keep each token dedicated to its role.
      - key: AUTOMATION_ADMIN_TOKEN
        sync: false
      - key: HOLLOW_VALLEY_API_TOKEN
        sync: false
      - key: PRESENCE_FEED_TOKEN
        sync: false
      - key: BINARYLANE_COMMAND_TOKEN
        sync: false
      - key: HERBYBOT_AUTOMATION_TOKEN
        sync: false

      # BinaryLane is the game-side edge. It pushes authoritative presence and
      # polls commands outbound over HTTPS; Render does not need an inbound VPS
      # port or a second website-side publisher.
      - key: COMMAND_BRIDGE_TRANSPORT
        value: http_pull
      - key: COMMAND_BRIDGE_ENABLED
        value: true
      - key: COMMAND_BRIDGE_SINGLE_PUBLISHER_ACK
        value: automation-platform-is-sole-publisher
      - key: COMMAND_BRIDGE_TIMEOUT_MS
        value: 20000

      # Stable shared application settings. Feature flags and reconcile/monitor
      # intervals are intentionally omitted so this blueprint cannot silently
      # reintroduce migration-era disabled states or five-minute fallbacks.
      - key: MAX_PLAYERS
        value: 100
      - key: ECONOMY_TIMEZONE
        value: Australia/Brisbane
      - key: BODYDROP_COOLDOWN_SECONDS
        value: 600
      - key: BODYDROP_UNKNOWN_AFTER_SECONDS
        value: 60
      - key: GLOBAL_BODYDROP_STAGGER_MS
        value: 2500
      - key: DINOSTORAGE_RESULT_MODE
        value: bridge_ack
      - key: DINOSTORAGE_UNKNOWN_AFTER_SECONDS
        value: 60
      - key: HERBYBOT_AUTOMATION_BATCH_SIZE
        value: 10
      - key: HERBYBOT_AUTOMATION_LEASE_SECONDS
        value: 60
      - key: HERBYBOT_OUTBOX_MAX_ATTEMPTS
        value: 5
