# Separate Render Blueprint for the Hollow Valley Automation Platform.
# This file is intentionally scoped to automation-platform and must create a
# NEW service. It must not replace or repoint the live Hollow Valley website.

services:
  - type: web
    name: hollow-valley-automation
    runtime: docker
    rootDir: automation-platform
    dockerfilePath: ./Dockerfile
    plan: starter
    autoDeploy: false
    healthCheckPath: /health
    disk:
      name: hollow-valley-automation-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3100
      - key: AUTOMATION_DB_PATH
        value: /var/data/automation.sqlite
      - key: AUTOMATION_ADMIN_TOKEN
        generateValue: true
      - key: HOLLOW_VALLEY_API_TOKEN
        generateValue: true
      - key: AUTOMATION_SCHEDULER_INTERVAL_MS
        value: 15000

      # Consistent SQLite snapshots use the same persistent disk. Enable only
      # after the disk has been verified to survive redeploys.
      - key: AUTOMATION_BACKUP_ENABLED
        value: false
      - key: AUTOMATION_BACKUP_DIR
        value: /var/data/backups
      - key: AUTOMATION_BACKUP_INTERVAL_MS
        value: 21600000
      - key: AUTOMATION_BACKUP_RETENTION
        value: 20

      # RCON read access can be configured without enabling writes.
      - key: RCON_HOST
        sync: false
      - key: RCON_PORT
        sync: false
      - key: RCON_PASSWORD
        sync: false
      - key: RCON_TIMEOUT_MS
        value: 6000
      - key: RCON_WRITE_ENABLED
        value: false

      # Read-only player session history is opt-in after RCON verification.
      - key: PLAYER_PRESENCE_ENABLED
        value: false
      - key: PLAYER_PRESENCE_INTERVAL_MS
        value: 60000

      # Read-only uptime/player-count history is also opt-in.
      - key: SERVER_HEALTH_HISTORY_ENABLED
        value: false
      - key: SERVER_HEALTH_HISTORY_INTERVAL_MS
        value: 60000
      - key: SERVER_HEALTH_HISTORY_RETENTION_HOURS
        value: 720

      # Server monitoring remains disabled until Discord alerts are verified.
      - key: SERVER_MONITOR_ENABLED
        value: false
      - key: SERVER_MONITOR_INTERVAL_MS
        value: 60000
      - key: SERVER_MONITOR_FAILURE_THRESHOLD
        value: 3

      # VeryGames FTP credentials may be added for diagnostics, but publishing
      # stays disabled until CommandBridge queue ownership is reviewed.
      - key: GAME_FILE_PROTOCOL
        value: ftp
      - key: SFTP_HOST
        sync: false
      - key: SFTP_PORT
        value: 21
      - key: SFTP_USER
        sync: false
      - key: SFTP_PASSWORD
        sync: false
      - key: SFTP_BASE_PATH
        value: /
      - key: FTP_SECURE
        value: false
      - key: COMMAND_BRIDGE_ENABLED
        value: false
      # Set manually only after the old website publisher is disabled. Expected
      # value: automation-platform-is-sole-publisher
      - key: COMMAND_BRIDGE_SINGLE_PUBLISHER_ACK
        sync: false
      - key: COMMAND_BRIDGE_SAVED_PATH
        value: Mods/CommandBridge/Saved
      - key: COMMAND_BRIDGE_TIMEOUT_MS
        value: 20000

      - key: BODYDROP_BRIDGE_MODE
        value: commandbridge
      - key: BODYDROP_COOLDOWN_SECONDS
        value: 900
      - key: BODYDROP_UNKNOWN_AFTER_SECONDS
        value: 60
      - key: BODYDROP_RECONCILE_INTERVAL_MS
        value: 5000

      - key: DINOSTORAGE_RESULT_MODE
        value: bridge_ack
      - key: DINOSTORAGE_UNKNOWN_AFTER_SECONDS
        value: 60
      - key: DINOSTORAGE_RECONCILE_INTERVAL_MS
        value: 5000
      # Admin restore JSON generation is always available to authenticated
      # operators. Actual FTP slot uploads remain separately locked.
      - key: ADMIN_RESTORE_WRITE_ENABLED
        value: false

      # HerbyBot bridge. This is a server-to-server credential used by the
      # existing live HerbyBot to claim and acknowledge durable outbox events.
      - key: HERBYBOT_AUTOMATION_TOKEN
        generateValue: true
      - key: HERBYBOT_AUTOMATION_POLL_INTERVAL_MS
        value: 15000
      - key: HERBYBOT_AUTOMATION_BATCH_SIZE
        value: 10
      - key: HERBYBOT_AUTOMATION_LEASE_SECONDS
        value: 60
      - key: HERBYBOT_OUTBOX_MAX_ATTEMPTS
        value: 5

      # Optional Discord REST automation. Leave IDs/tokens unset until the
      # separate service is ready for controlled testing.
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: DISCORD_STATUS_CHANNEL_ID
        sync: false
      - key: DISCORD_ANNOUNCEMENT_CHANNEL_ID
        sync: false
      - key: DISCORD_ALERT_CHANNEL_ID
        sync: false
      - key: DISCORD_STATUS_SYNC_INTERVAL_MS
        value: 300000
